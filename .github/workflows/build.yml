name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test, compile, and process resources
        run: .\gradle.bat --configure-on-demand --no-daemon --no-build-cache -Pbuild_number=build${{ github.run_number }} -Prelease_channel=dev :common:test :fabric:compileJava :forge:compileJava :neoforge:compileJava :fabric:processResources :forge:processResources :neoforge:processResources
